AWSTemplateFormatVersion: '2010-09-09'
Description: 'Simple test'

Resources:
  TestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole

Outputs:
  RoleArn:
    Value: !GetAtt TestRole.Arn